name: Build review packages (no publication)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            command: npm run dist:win
          - os: macos-14
            command: npx electron-builder --mac dmg --x64 --arm64 --publish never
          - os: ubuntu-24.04
            command: npm run dist:linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-review-${{ matrix.os }}
          path: |
            dist/desktop/*.exe
            dist/desktop/*.dmg
            dist/desktop/*.AppImage
            dist/desktop/*.deb
            dist/desktop/*.rpm
          if-no-files-found: error
          retention-days: 7
  android:
    # Set the protected 'release-build' environment, its reviewer and keystore
    # secrets before enabling Android package builds. Never generate a new key.
    if: github.ref == 'refs/heads/main' && vars.DROPSYNC_ANDROID_RELEASE_READY == 'true'
    environment: release-build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Materialize existing release key outside checkout
        env:
          KEY_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/dropsync-release.jks"
      - name: Build signed APK
        working-directory: android
        env:
          DROPSYNC_ANDROID_KEYSTORE: ${{ runner.temp }}/dropsync-release.jks
          DROPSYNC_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          DROPSYNC_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DROPSYNC_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash gradlew --no-daemon assembleRelease
      - name: Remove temporary keystore
        if: always()
        run: rm -f -- "$RUNNER_TEMP/dropsync-release.jks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-review
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
