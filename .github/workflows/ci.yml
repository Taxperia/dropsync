name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-node-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # No repository program runs with network access or a writable checkout.
      - name: Fetch test toolchain
        run: docker pull node:22-bookworm-slim
      - name: Test in a constrained container
        run: bash scripts/test-isolated.sh
